[package]
name = "skaner-dokumentow"
version = "0.2.1"
edition = "2024"
description = "Prosty skaner dokumentow dla IRIScan Visualizer 7"

[dependencies]
reqwest = { version = "0.12.12", features = ["multipart", "blocking", "json"] }
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false }
lopdf = "0.44"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-msmf"] }
open = "5.4.0"
rfd = "0.15.4"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
trash = "5.2.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = "thin"
# Speed over size: warp/enhance na klatkach 11-13 MP tracą wyraźnie na "s".
opt-level = 3
strip = true
